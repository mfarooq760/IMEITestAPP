name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project files
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "IMEITestAPP"
          include(":app")
          EOF_FILE
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_FILE
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.imeitest"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.imeitest"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="IMEI Test"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/example/imeitest/MainActivity.kt)
          cat > app/src/main/java/com/example/imeitest/MainActivity.kt <<'EOF_FILE'
          package com.example.imeitest

          import android.content.Context
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.Button
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import java.security.MessageDigest

          // ======================= HARDCODED AUTHORIZATION CONFIG =======================

          object DeviceAuthorizationConfig {
              // SHA-256 of the default code (the code itself is not stored in plain text).
              private const val ADMIN_CODE_SHA256 = "fbc1451ffa95b60a8292796bdc1a0ff124cc0c34f04395af35123256706e5218"

              // Authorized IMEI (15 digits, one slot). Change this before building each APK.
              private const val AUTHORIZED_IMEI = "359212531166971"

              fun isAdminCodeValid(input: String): Boolean {
                  val actual = sha256Hex(input.trim())
                  return MessageDigest.isEqual(actual.toByteArray(), ADMIN_CODE_SHA256.toByteArray())
              }

              fun isImeiAuthorized(input: String): Boolean {
                  val typed = normalizeImei(input)
                  return typed.length == AUTHORIZED_IMEI.length &&
                      MessageDigest.isEqual(typed.toByteArray(), AUTHORIZED_IMEI.toByteArray())
              }

              // Accepts "359212531166971" or "359212531166971/26": keeps only the digits before any "/".
              private fun normalizeImei(input: String): String =
                  input.trim().substringBefore('/').filter { it.isDigit() }

              private fun sha256Hex(text: String): String =
                  MessageDigest.getInstance("SHA-256")
                      .digest(text.toByteArray())
                      .joinToString("") { "%02x".format(it) }
          }

          // ======================= REGISTRATION STORAGE =======================

          object RegistrationStore {
              private const val PREFS = "device_registration"
              private const val KEY_REGISTERED = "registered"

              fun isRegistered(context: Context): Boolean =
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getBoolean(KEY_REGISTERED, false)

              fun markRegistered(context: Context) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putBoolean(KEY_REGISTERED, true).apply()
              }
          }

          // ======================= ACTIVITY =======================

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          var registered by remember {
                              mutableStateOf(RegistrationStore.isRegistered(this@MainActivity))
                          }
                          if (registered) {
                              DashboardScreen()
                          } else {
                              frmRegisterAppwlWithIMEI(
                                  onRegistered = {
                                      RegistrationStore.markRegistered(this@MainActivity)
                                      registered = true
                                  },
                                  onRejected = { finishAffinity() }
                              )
                          }
                      }
                  }
              }
          }

          // ======================= REGISTRATION SCREEN =======================

          @Composable
          fun frmRegisterAppwlWithIMEI(onRegistered: () -> Unit, onRejected: () -> Unit) {
              var code by remember { mutableStateOf("") }
              var codeVerified by remember { mutableStateOf(false) }
              var codeError by remember { mutableStateOf<String?>(null) }
              var imei by remember { mutableStateOf("") }
              var showRejectDialog by remember { mutableStateOf(false) }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text("Register App with IMEI", style = MaterialTheme.typography.headlineSmall)

                  if (!codeVerified) {
                      OutlinedTextField(
                          value = code,
                          onValueChange = { code = it },
                          label = { Text("Default code") },
                          visualTransformation = PasswordVisualTransformation(),
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )
                      codeError?.let { Text(it, color = MaterialTheme.colorScheme.error) }
                      Button(
                          onClick = {
                              if (DeviceAuthorizationConfig.isAdminCodeValid(code)) {
                                  codeVerified = true
                                  codeError = null
                              } else {
                                  codeError = "Incorrect code."
                              }
                          },
                          modifier = Modifier.fillMaxWidth()
                      ) { Text("Verify Code") }
                  } else {
                      OutlinedTextField(
                          value = imei,
                          onValueChange = { imei = it },
                          label = { Text("Phone IMEI (one slot)") },
                          keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Text),
                          singleLine = true,
                          modifier = Modifier.fillMaxWidth()
                      )
                      Button(
                          onClick = {
                              if (DeviceAuthorizationConfig.isImeiAuthorized(imei)) onRegistered()
                              else showRejectDialog = true
                          },
                          modifier = Modifier.fillMaxWidth()
                      ) { Text("Register App with IMEI") }
                  }
              }

              if (showRejectDialog) {
                  AlertDialog(
                      onDismissRequest = {},
                      title = { Text("Registration failed") },
                      text = { Text("We can not register with this IMEI slot. Please contact the developer concerned.") },
                      confirmButton = { TextButton(onClick = onRejected) { Text("OK") } }
                  )
              }
          }

          // ======================= DASHBOARD (MAIN SCREEN) =======================

          @Composable
          fun DashboardScreen() {
              var first by remember { mutableStateOf("") }
              var second by remember { mutableStateOf("") }
              var sum by remember { mutableStateOf("") }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text("Add Two Numbers", style = MaterialTheme.typography.headlineSmall)

                  OutlinedTextField(
                      value = first,
                      onValueChange = { first = it },
                      label = { Text("First number") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )
                  OutlinedTextField(
                      value = second,
                      onValueChange = { second = it },
                      label = { Text("Second number") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Button(
                      onClick = {
                          val a = first.trim().toBigDecimalOrNull()
                          val b = second.trim().toBigDecimalOrNull()
                          sum = if (a != null && b != null) (a + b).toPlainString()
                          else "Enter two valid numbers"
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) { Text("Add") }

                  OutlinedTextField(
                      value = sum,
                      onValueChange = {},
                      readOnly = true,
                      label = { Text("Result") },
                      modifier = Modifier.fillMaxWidth()
                  )
              }
          }
          EOF_FILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
