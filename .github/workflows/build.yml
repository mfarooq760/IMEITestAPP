name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate project files
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "IMEITestAPP"
          include(":app")
          EOF_FILE
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_FILE
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.imeitest"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.imeitest"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.telephony" android:required="false" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />

              <application
                  android:label="IMEI Test"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/example/imeitest/MainActivity.kt)
          cat > app/src/main/java/com/example/imeitest/MainActivity.kt <<'EOF_FILE'
          package com.example.imeitest

          import android.Manifest
          import android.app.admin.DevicePolicyManager
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.telephony.TelephonyManager
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material3.Button
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedButton
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.unit.dp
          import java.math.BigDecimal

          // ======================= IMEI RETRIEVAL =======================

          data class SlotImei(val slotIndex: Int, val imei: String)

          sealed interface ImeiResult {
              data class Available(val imeis: List<SlotImei>) : ImeiResult

              sealed class Unavailable(val message: String) : ImeiResult {
                  object NoTelephony : Unavailable("This device has no telephony hardware, so it has no IMEI.")
                  data class PermissionMissing(val permission: String) :
                      Unavailable("Permission $permission has not been granted to this app.")
                  data class AccessDenied(val detail: String?) : Unavailable(
                      "Android denied IMEI access (SecurityException). Apps targeting Android 10+ can read " +
                          "the IMEI only if privileged, device-owner or carrier-privileged. ${detail.orEmpty()}"
                  )
                  object NoValueReported : Unavailable(
                      "Telephony returned no IMEI (empty slots, CDMA-only modem, tablet or emulator)."
                  )
                  data class Failure(val detail: String?) :
                      Unavailable("Unexpected telephony error: ${detail.orEmpty()}")
              }
          }

          class ImeiProvider(context: Context) {
              private val appContext = context.applicationContext

              fun environmentDescription(): String {
                  val dpm = appContext.getSystemService(DevicePolicyManager::class.java)
                  val pkg = appContext.packageName
                  return when {
                      dpm != null && (dpm.isDeviceOwnerApp(pkg) || dpm.isProfileOwnerApp(pkg)) ->
                          "Device/profile owner app"
                      isGranted(PRIVILEGED_PERMISSION) -> "Privileged system app"
                      else -> "Ordinary APK"
                  }
              }

              fun readImeis(): ImeiResult {
                  return try {
                      if (!appContext.packageManager.hasSystemFeature(PackageManager.FEATURE_TELEPHONY)) {
                          return ImeiResult.Unavailable.NoTelephony
                      }
                      val telephony = appContext.getSystemService(TelephonyManager::class.java)
                          ?: return ImeiResult.Unavailable.NoTelephony

                      if (!isGranted(PRIVILEGED_PERMISSION) && !isGranted(Manifest.permission.READ_PHONE_STATE)) {
                          return ImeiResult.Unavailable.PermissionMissing(Manifest.permission.READ_PHONE_STATE)
                      }

                      val found = mutableListOf<SlotImei>()
                      for (slot in 0 until modemCount(telephony)) {
                          val value = try {
                              telephony.getImei(slot)
                          } catch (e: SecurityException) {
                              return ImeiResult.Unavailable.AccessDenied(e.message)
                          } catch (e: IllegalArgumentException) {
                              null
                          }
                          if (!value.isNullOrBlank()) found += SlotImei(slot, value.trim())
                      }
                      if (found.isEmpty()) ImeiResult.Unavailable.NoValueReported
                      else ImeiResult.Available(found)
                  } catch (e: SecurityException) {
                      ImeiResult.Unavailable.AccessDenied(e.message)
                  } catch (e: Exception) {
                      ImeiResult.Unavailable.Failure(e.message)
                  }
              }

              private fun isGranted(permission: String) =
                  appContext.checkSelfPermission(permission) == PackageManager.PERMISSION_GRANTED

              @Suppress("DEPRECATION")
              private fun modemCount(telephony: TelephonyManager): Int {
                  val count = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      telephony.activeModemCount
                  } else {
                      telephony.phoneCount
                  }
                  return count.coerceAtLeast(1)
              }

              private companion object {
                  const val PRIVILEGED_PERMISSION = "android.permission.READ_PRIVILEGED_PHONE_STATE"
              }
          }

          // ======================= UI =======================

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme { TestScreen() }
                  }
              }
          }

          @Composable
          fun TestScreen() {
              val context = LocalContext.current
              val provider = remember { ImeiProvider(context) }

              var first by remember { mutableStateOf("") }
              var second by remember { mutableStateOf("") }
              var sum by remember { mutableStateOf("") }
              var imeiStatus by remember { mutableStateOf("Not checked yet.") }

              fun checkImei() {
                  imeiStatus = when (val r = provider.readImeis()) {
                      is ImeiResult.Available ->
                          r.imeis.joinToString("\n") { "Slot ${it.slotIndex}: ${it.imei}" }
                      is ImeiResult.Unavailable -> r.message
                  }
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { checkImei() }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text("Add Two Numbers", style = MaterialTheme.typography.headlineSmall)

                  OutlinedTextField(
                      value = first,
                      onValueChange = { first = it },
                      label = { Text("First number") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )
                  OutlinedTextField(
                      value = second,
                      onValueChange = { second = it },
                      label = { Text("Second number") },
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Decimal),
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Button(
                      onClick = {
                          val a = first.trim().toBigDecimalOrNull()
                          val b = second.trim().toBigDecimalOrNull()
                          sum = if (a != null && b != null) (a + b).toPlainString()
                          else "Enter two valid numbers"
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) { Text("Add") }

                  OutlinedTextField(
                      value = sum,
                      onValueChange = {},
                      readOnly = true,
                      label = { Text("Result") },
                      modifier = Modifier.fillMaxWidth()
                  )

                  Text("IMEI Test", style = MaterialTheme.typography.titleMedium)
                  Text("Environment: ${provider.environmentDescription()}")

                  OutlinedButton(
                      onClick = {
                          if (context.checkSelfPermission(Manifest.permission.READ_PHONE_STATE)
                              == PackageManager.PERMISSION_GRANTED
                          ) checkImei()
                          else permissionLauncher.launch(Manifest.permission.READ_PHONE_STATE)
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) { Text("Read IMEI") }

                  Text(imeiStatus)
              }
          }
          EOF_FILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
